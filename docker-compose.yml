# GuardPay — local development stack (init scaffold).
# Only Postgres is fully runnable at this step.
# backend / ai-service / frontend services are planned and kept minimal
# so `docker compose config` validates without requiring app code yet.
name: guardpay

services:
  db:
    image: postgres:16-alpine
    container_name: guardpay-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: guardpay
      POSTGRES_USER: guardpay
      POSTGRES_PASSWORD: guardpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardpay -d guardpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: guardpay-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: guardpay
      DB_USERNAME: guardpay
      DB_PASSWORD: guardpay
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Planned (not used yet):
      # JWT_SECRET: ${JWT_SECRET}
      # PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID}
      # PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET}
      # Container-to-container AI address (host runs use the localhost default).
      AI_SERVICE_BASE_URL: http://ai-service:8001
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./ai-service
    container_name: guardpay-ai-service
    restart: unless-stopped
    environment:
      # OPENAI_API_KEY comes from the shell environment only — never committed.
      # Without it the service boots and reports ai_configured=false.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_SERVICE_PORT: "8001"
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
    container_name: guardpay-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
