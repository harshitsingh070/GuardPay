# GuardPay — full local stack.
#
#   docker compose up --build
#
# Frontend: http://localhost:3000
# Backend:  http://localhost:8080
# AI:       http://localhost:8001
#
# PayPal and Groq credentials are optional for the deterministic demo:
#   $env:PAYPAL_CLIENT_ID="..."
#   $env:PAYPAL_CLIENT_SECRET="..."
#   $env:OPENAI_API_KEY="<groq-key>"   # Groq is the default LLM provider
# Never commit real credentials. See README.md and docs/demo.md.
name: guardpay

services:
  db:
    image: postgres:16-alpine
    container_name: guardpay-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: guardpay
      POSTGRES_USER: guardpay
      POSTGRES_PASSWORD: guardpay
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardpay -d guardpay"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: guardpay-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: guardpay
      DB_USERNAME: guardpay
      DB_PASSWORD: guardpay
      CORS_ALLOWED_ORIGINS: http://localhost:3000,https://appassets.androidplatform.net
      AI_SERVICE_BASE_URL: http://ai-service:8001
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:-}
      # Two sequential Groq calls can exceed the local 8s default.
      AI_SERVICE_READ_TIMEOUT_MS: ${AI_SERVICE_READ_TIMEOUT_MS:-15000}
      PAYPAL_BASE_URL: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
      GUARDPAY_AUTH_COOKIE_SECURE: "false"
      GUARDPAY_DEV_VERIFICATION_OUTBOX: "true"
      GUARDPAY_INTELLIGENCE_ADMIN_EMAILS: ${GUARDPAY_INTELLIGENCE_ADMIN_EMAILS:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  ai-service:
    build:
      context: ./ai-service
    container_name: guardpay-ai-service
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-openai/gpt-oss-20b}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_SERVICE_PORT: "8001"
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_INTERNAL_TOKEN:-}
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: guardpay-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
