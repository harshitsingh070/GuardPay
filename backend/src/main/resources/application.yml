# GuardPay backend â€” Milestone 2 foundation.
# PostgreSQL comes exclusively from environment variables (never hard-coded).
# Local defaults match `docker-compose.yml` (db: guardpay/guardpay).
#
# Local secrets live in gitignored `backend/.env`, loaded by
# DotenvPropertyInitializer (works from the repo root and from backend/).
# Explicit OS environment variables always take precedence over the file.
server:
  port: 8080

spring:
  application:
    name: guardpay-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:guardpay}
    username: ${DB_USERNAME:guardpay}
    password: ${DB_PASSWORD:guardpay}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  # Flyway owns the schema (db/migration). Hibernate only validates.
  flyway:
    enabled: true
    locations: classpath:db/migration

# CORS origins for browser clients (comma-separated). Default: Vite dev server.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://appassets.androidplatform.net}

# PayPal Sandbox. Credentials come from the environment only â€” never commit them.
# The backend boots without them; PayPal calls fail clearly at use time.
guardpay:
  auth:
    enabled: ${GUARDPAY_AUTH_ENABLED:true}
    cookie-secure: ${GUARDPAY_AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${GUARDPAY_AUTH_COOKIE_SAME_SITE:Lax}
    require-https: ${GUARDPAY_AUTH_REQUIRE_HTTPS:false}
    csrf-enabled: ${GUARDPAY_AUTH_CSRF_ENABLED:true}
    csrf-secret: ${GUARDPAY_AUTH_CSRF_SECRET:}
    login-max-attempts: ${GUARDPAY_AUTH_LOGIN_MAX_ATTEMPTS:5}
    login-ip-max-attempts: ${GUARDPAY_AUTH_LOGIN_IP_MAX_ATTEMPTS:20}
    login-window-minutes: ${GUARDPAY_AUTH_LOGIN_WINDOW_MINUTES:15}
    login-lockout-minutes: ${GUARDPAY_AUTH_LOGIN_LOCKOUT_MINUTES:15}
    session-cleanup-initial-delay-ms: ${GUARDPAY_AUTH_SESSION_CLEANUP_INITIAL_DELAY_MS:60000}
    session-cleanup-interval-ms: ${GUARDPAY_AUTH_SESSION_CLEANUP_INTERVAL_MS:3600000}
  # First-Time High-Value Payment Detection. All thresholds are configurable so
  # the deterministic engine can be tuned without code changes.
  risk:
    high-value:
      enabled: ${GUARDPAY_HIGH_VALUE_ENABLED:true}
      min-transactions-for-baseline: ${GUARDPAY_HIGH_VALUE_MIN_BASELINE:5}
      cold-start-threshold: ${GUARDPAY_HIGH_VALUE_COLD_START:10}
      established-threshold: ${GUARDPAY_HIGH_VALUE_ESTABLISHED:20}
      min-meaningful-deviation-ratio: ${GUARDPAY_HIGH_VALUE_MIN_DEVIATION:1.50}
      modified-z-significant-threshold: ${GUARDPAY_HIGH_VALUE_Z_SIGNIFICANT:3.00}
      modified-z-extreme-threshold: ${GUARDPAY_HIGH_VALUE_Z_EXTREME:4.50}
      zero-mad-threshold: ${GUARDPAY_HIGH_VALUE_ZERO_MAD:0.01}
      zero-mad-significant-ratio: ${GUARDPAY_HIGH_VALUE_ZERO_MAD_RATIO:2.50}
      amount-within-scale-z-threshold: ${GUARDPAY_HIGH_VALUE_SCALE_Z:2.50}
      normal-amount-ratio-ceiling: ${GUARDPAY_HIGH_VALUE_NORMAL_RATIO:2.00}
      percentile-high-value: ${GUARDPAY_HIGH_VALUE_PERCENTILE:0.90}
      percentile-extreme: ${GUARDPAY_HIGH_VALUE_EXTREME_PERCENTILE:0.95}
      historical-max-escalation-factor: ${GUARDPAY_HIGH_VALUE_MAX_FACTOR:1.25}
      recipient-escalation-factor: ${GUARDPAY_HIGH_VALUE_RECIPIENT_FACTOR:3.00}
      recipient-max-escalation-factor: ${GUARDPAY_HIGH_VALUE_RECIPIENT_MAX_FACTOR:2.00}
      recipient-min-modified-z: ${GUARDPAY_HIGH_VALUE_RECIPIENT_MIN_Z:2.00}
      new-recipient-critical-ratio: ${GUARDPAY_HIGH_VALUE_NEW_RECIPIENT_CRITICAL:5.00}
      recipient-critical-ratio: ${GUARDPAY_HIGH_VALUE_RECIPIENT_CRITICAL:4.00}
      extreme-ratio-over-max: ${GUARDPAY_HIGH_VALUE_EXTREME_MAX_RATIO:2.00}
      recent-window-days: ${GUARDPAY_HIGH_VALUE_RECENT_WINDOW_DAYS:7}
      medium-window-days: ${GUARDPAY_HIGH_VALUE_MEDIUM_WINDOW_DAYS:30}
      long-window-days: ${GUARDPAY_HIGH_VALUE_LONG_WINDOW_DAYS:90}
      rapid-escalation-window-days: ${GUARDPAY_HIGH_VALUE_RAPID_WINDOW_DAYS:7}
      rapid-escalation-factor: ${GUARDPAY_HIGH_VALUE_RAPID_FACTOR:4.00}
      max-signal-contribution: ${GUARDPAY_HIGH_VALUE_MAX_SIGNAL:25}
      confidence-cold-start: ${GUARDPAY_HIGH_VALUE_CONFIDENCE_COLD_START:0.30}
      confidence-discount-cold-start: ${GUARDPAY_HIGH_VALUE_CONFIDENCE_EARLY:0.60}
      confidence-initializing: ${GUARDPAY_HIGH_VALUE_CONFIDENCE_INITIALIZING:0.70}
      confidence-established: ${GUARDPAY_HIGH_VALUE_CONFIDENCE_ESTABLISHED:0.90}
    # Signal-correlation bounds and per-rule weights. These are evidence-only
    # and bounded; the deterministic engine remains the decision authority.
    correlation:
      max-contribution-points: ${GUARDPAY_CORRELATION_MAX_POINTS:25}
      interaction-threshold: ${GUARDPAY_CORRELATION_INTERACTION_THRESHOLD:0.12}
      minimum-signal-confidence: ${GUARDPAY_CORRELATION_MIN_CONFIDENCE:0.5}
      overlap-threshold: ${GUARDPAY_CORRELATION_OVERLAP_THRESHOLD:0.6}
      dependency-discount: ${GUARDPAY_CORRELATION_DEPENDENCY_DISCOUNT:0.5}
      family-contribution-cap: ${GUARDPAY_CORRELATION_FAMILY_CAP:12}
      freshness-factor: ${GUARDPAY_CORRELATION_FRESHNESS:1.0}
      strength-floor: ${GUARDPAY_CORRELATION_STRENGTH_FLOOR:0.05}
      rule-weights:
        "[ACCOUNT_TAKEOVER_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_ACCOUNT_TAKEOVER:0.95}
        "[ACCOUNT_TAKEOVER_VELOCITY_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_ACCOUNT_TAKEOVER_VELOCITY:0.9}
        "[ACCOUNT_TAKEOVER_ATTEMPT_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_ACCOUNT_TAKEOVER_ATTEMPT:0.9}
        "[SOCIAL_ENGINEERING_CALL_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_SOCIAL_CALL:1.0}
        "[SOCIAL_ENGINEERING_RECIPIENT_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_SOCIAL_RECIPIENT:1.0}
        "[PHISHING_CONTENT_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_PHISHING:0.95}
        "[VELOCITY_AMOUNT_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_VELOCITY_AMOUNT:0.85}
        "[SPLIT_PAYMENT_RECIPIENT_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_SPLIT:0.9}
        "[NEW_RECIPIENT_AMOUNT_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_NEW_RECIPIENT:0.8}
        "[VPN_DEVICE_GEO_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_VPN:0.85}
        "[AMOUNT_TIME_FREQUENCY_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_AMOUNT_TIME:0.85}
        "[AMOUNT_RECIPIENT_GEO_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_AMOUNT_RECIPIENT_GEO:0.85}
        "[BEHAVIORAL_MULTI_DIMENSION_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_BEHAVIORAL:0.8}
        "[FIRST_TIME_HIGH_VALUE_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_FIRST_HIGH_VALUE:0.95}
        "[HIGH_VALUE_ACCOUNT_TAKEOVER_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_HIGH_VALUE_ATO:1.0}
        "[HIGH_VALUE_SOCIAL_ENGINEERING_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_HIGH_VALUE_SOCIAL:1.0}
        "[HIGH_VALUE_SUSPICIOUS_RECIPIENT_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_HIGH_VALUE_SUSPICIOUS:1.0}
        "[RAPID_FINANCIAL_ESCALATION_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_RAPID:0.9}
        "[HIGH_VALUE_BEHAVIORAL_DEVIATION_COMBO]": ${GUARDPAY_CORRELATION_WEIGHT_HIGH_VALUE_BEHAVIORAL:0.85}
  # Shared recipient reputation store (not a graph/network). Identifiers are
  # HMAC-SHA-256 hashed; without a key the feature reports UNAVAILABLE instead
  # of "clean".
  intelligence:
    enabled: ${GUARDPAY_INTELLIGENCE_ENABLED:true}
    active-key-version: ${GUARDPAY_INTELLIGENCE_ACTIVE_KEY_VERSION:1}
    hmac-keys:
      "1": ${GUARDPAY_INTELLIGENCE_HMAC_KEY_V1:}
    report-rate-limit-per-hour: ${GUARDPAY_INTELLIGENCE_REPORT_RATE_LIMIT_HOURLY:5}
    report-rate-limit-per-recipient-per-day: ${GUARDPAY_INTELLIGENCE_REPORT_RATE_LIMIT_RECIPIENT_DAILY:1}
    evidence-half-life-days: ${GUARDPAY_INTELLIGENCE_EVIDENCE_HALF_LIFE_DAYS:180}
    evidence-retention-days: ${GUARDPAY_INTELLIGENCE_EVIDENCE_RETENTION_DAYS:365}
    stale-calculation-hours: ${GUARDPAY_INTELLIGENCE_STALE_CALCULATION_HOURS:24}
    maintenance-interval-ms: ${GUARDPAY_INTELLIGENCE_MAINTENANCE_INTERVAL_MS:3600000}
    admin-emails: ${GUARDPAY_INTELLIGENCE_ADMIN_EMAILS:}
  paypal:
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    webhook-id: ${PAYPAL_WEBHOOK_ID:}
  # Python AI evidence service (optional; deterministic signals always work).
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
    enabled: ${AI_SERVICE_ENABLED:true}
    # Optional shared secret for the internal AI endpoint. Set the same
    # AI_SERVICE_INTERNAL_TOKEN for Spring Boot and the Python service; requests
    # without it are rejected by the Python service.
    api-key: ${AI_SERVICE_INTERNAL_TOKEN:}
    connect-timeout-millis: ${AI_SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-millis: ${AI_SERVICE_READ_TIMEOUT_MS:8000}
    failure-threshold: ${AI_SERVICE_FAILURE_THRESHOLD:3}
    open-seconds: ${AI_SERVICE_OPEN_SECONDS:30}
  # Controlled VERIFY challenges (simulated channel until an identity provider exists).
  # The dev outbox keeps the code in server memory and exposes it only to a
  # loopback caller; disable it in production or when a real channel exists.
  verification:
    ttl-minutes: ${GUARDPAY_VERIFICATION_TTL_MINUTES:10}
    max-attempts: ${GUARDPAY_VERIFICATION_MAX_ATTEMPTS:3}
    dev-outbox-enabled: ${GUARDPAY_DEV_VERIFICATION_OUTBOX:true}
    # Real email OTP is used only when enabled AND spring.mail.host is set.
    email-enabled: ${GUARDPAY_VERIFICATION_EMAIL_ENABLED:false}
    email-from: ${GUARDPAY_VERIFICATION_EMAIL_FROM:no-reply@guardpay.local}
  # Alert delivery: SSE is always on; email/SMS adapters activate only when
  # configured. The outbox guarantees a CRITICAL alert is not lost on a crash.
  alerts:
    dispatch-interval-ms: ${GUARDPAY_ALERT_DISPATCH_INTERVAL_MS:2000}
    email-enabled: ${GUARDPAY_ALERTS_EMAIL_ENABLED:true}
    email-from: ${GUARDPAY_ALERTS_EMAIL_FROM:no-reply@guardpay.local}
  # Development HTTP tracing: inbound request/response bodies and outbound
  # PayPal/AI calls. Tokens, secrets, signatures, verification codes, and
  # challenge codes are masked. Set the body or header switches to false to
  # reduce console noise.
  logging:
    http:
      include-headers: ${GUARDPAY_HTTP_LOG_HEADERS:true}
      include-bodies: ${GUARDPAY_HTTP_LOG_BODIES:true}
      max-body-chars: ${GUARDPAY_HTTP_LOG_MAX_BODY_CHARS:8000}

logging:
  level:
    root: INFO
    com.guardpay: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    # requestId is set by RequestLoggingFilter, so every log written while a
    # request is being handled (including outbound PayPal/AI calls) is traceable.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"

