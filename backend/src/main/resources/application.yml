# GuardPay backend — Milestone 2 foundation.
# PostgreSQL comes exclusively from environment variables (never hard-coded).
# Local defaults match `docker-compose.yml` (db: guardpay/guardpay).
#
# Local secrets live in gitignored `backend/.env`, loaded by
# DotenvPropertyInitializer (works from the repo root and from backend/).
# Explicit OS environment variables always take precedence over the file.
server:
  port: 8080

spring:
  application:
    name: guardpay-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:guardpay}
    username: ${DB_USERNAME:guardpay}
    password: ${DB_PASSWORD:guardpay}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  # Flyway owns the schema (db/migration). Hibernate only validates.
  flyway:
    enabled: true
    locations: classpath:db/migration

# CORS origins for browser clients (comma-separated). Default: Vite dev server.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://appassets.androidplatform.net}

# PayPal Sandbox. Credentials come from the environment only — never commit them.
# The backend boots without them; PayPal calls fail clearly at use time.
guardpay:
  paypal:
    base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    webhook-id: ${PAYPAL_WEBHOOK_ID:}
  # Development device pairing (see DeviceSignalProperties javadoc).
  device:
    signal-token: ${GUARDPAY_DEVICE_SIGNAL_TOKEN:}
  # Python AI evidence service (optional; deterministic signals always work).
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8001}
    enabled: ${AI_SERVICE_ENABLED:true}
  # Controlled VERIFY challenges (simulated channel until an identity provider exists).
  verification:
    ttl-minutes: ${GUARDPAY_VERIFICATION_TTL_MINUTES:10}
    max-attempts: ${GUARDPAY_VERIFICATION_MAX_ATTEMPTS:3}
  # Development HTTP tracing: inbound request/response bodies and outbound
  # PayPal/AI calls. Tokens, secrets, and signatures are masked. Set the body
  # or header switches to false to reduce console noise.
  logging:
    http:
      include-headers: ${GUARDPAY_HTTP_LOG_HEADERS:true}
      include-bodies: ${GUARDPAY_HTTP_LOG_BODIES:true}
      max-body-chars: ${GUARDPAY_HTTP_LOG_MAX_BODY_CHARS:8000}

logging:
  level:
    root: INFO
    com.guardpay: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    # requestId is set by RequestLoggingFilter, so every log written while a
    # request is being handled (including outbound PayPal/AI calls) is traceable.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"

